<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightwatch Logbook — daily regression</title>
<style>
  /* ---- 테마 토큰: OS 설정(prefers-color-scheme) + 토글(data-theme)이 둘 다 이긴다 ---- */
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface:     #fcfcfb;
    --ink:         #0b0b0b;
    --ink-2:       #52514e;
    --muted:       #898781;
    --grid:        #e1e0d9;
    --baseline:    #c3c2b7;
    --border:      rgba(11,11,11,0.10);
    --series-a:    #2a78d6;  /* cfg-a: blue */
    --series-b:    #eb6834;  /* cfg-b: orange */
    --series-c:    #1baf7a;  /* cfg-c: aqua */
    --critical:    #d03b3b;  /* 신규 fail 배지 */
    --good-text:   #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:      #0d0d0d;
      --surface:   #1a1a19;
      --ink:       #ffffff;
      --ink-2:     #c3c2b7;
      --muted:     #898781;
      --grid:      #2c2c2a;
      --baseline:  #383835;
      --border:    rgba(255,255,255,0.10);
      --series-a:  #3987e5;
      --series-b:  #d95926;
      --series-c:  #199e70;
      --critical:  #d03b3b;
      --good-text: #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:      #0d0d0d;
    --surface:   #1a1a19;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --muted:     #898781;
    --grid:      #2c2c2a;
    --baseline:  #383835;
    --border:    rgba(255,255,255,0.10);
    --series-a:  #3987e5;
    --series-b:  #d95926;
    --series-c:  #199e70;
    --critical:  #d03b3b;
    --good-text: #0ca30c;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 64px; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  header h1 { font-size: 20px; margin: 0; }
  header .sub { color: var(--ink-2); }
  header .spacer { flex: 1; }
  #theme-toggle {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
    border-radius: 8px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 13px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .card .caption { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }

  /* ---- 스탯 타일 ---- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; }
  .tile .label { color: var(--ink-2); font-size: 12.5px; }
  .tile .value { font-size: 30px; font-weight: 600; line-height: 1.2; }
  .tile .delta { font-size: 12.5px; color: var(--ink-2); }
  .tile .delta.up   { color: var(--critical); }
  .tile .delta.down { color: var(--good-text); }

  /* ---- 차트 ---- */
  .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 8px; font-size: 13px; color: var(--ink-2); }
  .legend .item { display: inline-flex; align-items: center; gap: 7px; }
  .legend .key { width: 18px; height: 0; border-top: 2.5px solid; border-radius: 2px; }
  #chart-wrap { position: relative; }
  #chart { display: block; width: 100%; height: auto; }
  #chart text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #tooltip {
    position: absolute; pointer-events: none; display: none; z-index: 3;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.14);
    padding: 8px 12px; min-width: 150px; font-size: 12.5px;
  }
  #tooltip .tt-date { color: var(--muted); margin-bottom: 4px; }
  #tooltip .tt-row { display: flex; align-items: center; gap: 7px; margin: 2px 0; }
  #tooltip .tt-key { width: 14px; height: 0; border-top: 2.5px solid; border-radius: 2px; }
  #tooltip .tt-val { font-weight: 600; font-variant-numeric: tabular-nums; }
  #tooltip .tt-name { color: var(--ink-2); }
  #tooltip .tt-new { color: var(--critical); margin-left: auto; padding-left: 8px; }

  /* ---- 상세 테이블 ---- */
  .detail-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .detail-head select {
    font: inherit; padding: 3px 8px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  }
  .cfg-block { margin-top: 14px; }
  .cfg-block h3 { font-size: 13.5px; margin: 0 0 6px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .cfg-block h3 .key { width: 14px; height: 0; border-top: 2.5px solid; border-radius: 2px; display: inline-block; }
  .cfg-block h3 .sum { color: var(--ink-2); font-weight: 400; font-size: 12.5px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-top: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; border-top: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td .mono, .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; }
  .excerpt { color: var(--ink-2); }
  .badge-new {
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--critical); font-weight: 600; font-size: 12px; white-space: nowrap;
  }
  .badge-new::before { content: "▲"; font-size: 9px; }
  .st-ongoing { color: var(--ink-2); font-size: 12px; white-space: nowrap; }
  .since { color: var(--muted); font-size: 11.5px; }
  .conf { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .all-green { color: var(--good-text); font-size: 13px; padding: 8px 0 2px; }
  a { color: var(--series-a); }

  details.trend-table { margin-top: 4px; }
  details.trend-table summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
  #error-box { display: none; border: 1px solid var(--critical); color: var(--critical);
               border-radius: 12px; padding: 14px 18px; margin-bottom: 16px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Nightwatch Logbook</h1>
    <span class="sub">daily regression 대시보드</span>
    <span class="spacer"></span>
    <span class="sub" id="range-label"></span>
    <button id="theme-toggle" type="button">테마 전환</button>
  </header>

  <div id="error-box"></div>

  <section class="stats" id="stats"></section>

  <section class="card">
    <h2>구성별 fail 추이</h2>
    <p class="caption">일자별 fail TC 수 · 차트를 클릭하면 해당 날짜 상세로 이동</p>
    <div class="legend" id="legend"></div>
    <div id="chart-wrap">
      <svg id="chart" role="img" aria-label="구성별 일자별 fail 수 추이 선 그래프"></svg>
      <div id="tooltip"></div>
    </div>
    <details class="trend-table">
      <summary>추이 데이터 표로 보기</summary>
      <div id="trend-table"></div>
    </details>
  </section>

  <section class="card">
    <div class="detail-head">
      <h2 style="margin:0">날짜별 상세</h2>
      <select id="date-select" aria-label="상세 조회 날짜 선택"></select>
    </div>
    <div id="detail"></div>
  </section>
</main>

<script>
"use strict";
// 데이터 위치: repo 루트 기준 results/. GitHub Pages(root 서빙) 또는
// `python3 -m http.server` (repo 루트에서 실행) 기준으로 동작한다.
const DATA_BASE = new URL("../results/", location.href);
const SERIES_VARS = ["--series-a", "--series-b", "--series-c"];
const CONF_LABEL = { high: "높음", medium: "추정", unknown: "불명" };

const state = { configs: [], index: {}, dates: [], daily: {}, selected: null };

const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;  // 라벨은 신뢰하지 않는 데이터 — textContent만 사용
  return n;
};

// ---- 테마 토글: data-theme 스탬프가 OS 설정을 양방향으로 이긴다 ----
$("theme-toggle").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).colorScheme.includes("dark");
  root.dataset.theme = dark ? "light" : "dark";
  render();  // 시리즈 색은 CSS 변수에서 읽으므로 다시 그린다
});

async function fetchJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${res.status} ${url}`);
  return res.json();
}

async function load() {
  const manifest = await fetchJson(new URL("configs.json", DATA_BASE));
  state.configs = manifest.configs;
  for (const cfg of state.configs) {
    state.index[cfg.id] = await fetchJson(new URL(`${cfg.id}/index.json`, DATA_BASE));
  }
  state.dates = state.index[state.configs[0].id].days.map((d) => d.date);
  state.selected = state.dates[state.dates.length - 1];
}

async function dailyOf(cfgId, date) {
  const key = `${cfgId}/${date}`;
  if (!state.daily[key]) {
    state.daily[key] = await fetchJson(new URL(`${cfgId}/${date}.json`, DATA_BASE));
  }
  return state.daily[key];
}

const dayRow = (cfgId, date) => state.index[cfgId].days.find((d) => d.date === date);
const mmdd = (date) => date.slice(5).replace("-", "/");

// ---------------------------------------------------------------- 스탯 타일
function renderStats() {
  const last = state.dates[state.dates.length - 1];
  const prev = state.dates[state.dates.length - 2];
  const sum = (date, k) => state.configs.reduce((a, c) => a + dayRow(c.id, date)[k], 0);

  const failNow = sum(last, "fail");
  const failDelta = failNow - sum(prev, "fail");
  const newNow = sum(last, "new_fail");
  const green = state.configs.filter((c) => dayRow(c.id, last).fail === 0).length;

  const stats = $("stats");
  stats.replaceChildren();
  const tile = (label, value, deltaNode) => {
    const t = el("div", "tile");
    t.appendChild(el("div", "label", label));
    t.appendChild(el("div", "value", String(value)));
    if (deltaNode) t.appendChild(deltaNode);
    stats.appendChild(t);
  };
  const d = el("div", "delta" + (failDelta > 0 ? " up" : failDelta < 0 ? " down" : ""),
               `${failDelta > 0 ? "▲" : failDelta < 0 ? "▼" : "—"} ${Math.abs(failDelta)} vs 전일`);
  tile(`전체 fail (${mmdd(last)})`, failNow, d);
  tile("신규 fail", newNow, el("div", "delta", "전 구성 합계"));
  tile("fail 없는 구성", `${green} / ${state.configs.length}`, el("div", "delta", "오늘 기준"));
}

// ---------------------------------------------------------------- 차트
const CH = { w: 1040, h: 320, top: 18, right: 130, bottom: 34, left: 44 };

function scales() {
  const maxFail = Math.max(...state.configs.flatMap((c) => state.index[c.id].days.map((d) => d.fail)));
  const yMax = Math.max(10, Math.ceil(maxFail / 10) * 10);
  const x = (i) => CH.left + (i * (CH.w - CH.left - CH.right)) / (state.dates.length - 1);
  const y = (v) => CH.top + (1 - v / yMax) * (CH.h - CH.top - CH.bottom);
  return { x, y, yMax };
}

function svgEl(tag, attrs) {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
}

function renderChart() {
  const svg = $("chart");
  svg.replaceChildren();
  svg.setAttribute("viewBox", `0 0 ${CH.w} ${CH.h}`);
  const { x, y, yMax } = scales();
  const surface = css("--surface");

  // 가로 그리드(hairline solid) + y 눈금
  for (let v = 0; v <= yMax; v += 10) {
    svg.appendChild(svgEl("line", { x1: CH.left, x2: CH.w - CH.right, y1: y(v), y2: y(v),
      stroke: v === 0 ? css("--baseline") : css("--grid"), "stroke-width": 1 }));
    svg.appendChild(Object.assign(svgEl("text", { x: CH.left - 8, y: y(v) + 4,
      "text-anchor": "end", "font-size": 11, fill: css("--muted"),
      style: "font-variant-numeric: tabular-nums" }), { textContent: v }));
  }
  // x 눈금 (일자)
  state.dates.forEach((d, i) => {
    svg.appendChild(Object.assign(svgEl("text", { x: x(i), y: CH.h - 10,
      "text-anchor": "middle", "font-size": 11, fill: css("--muted"),
      style: "font-variant-numeric: tabular-nums" }), { textContent: mmdd(d) }));
  });

  // 선택된 날짜 표시
  const selIdx = state.dates.indexOf(state.selected);
  if (selIdx >= 0) {
    svg.appendChild(svgEl("line", { x1: x(selIdx), x2: x(selIdx), y1: CH.top, y2: y(0),
      stroke: css("--baseline"), "stroke-width": 1, "stroke-dasharray": "none", opacity: 0.9 }));
  }

  // 크로스헤어 (hover 시 표시)
  const crosshair = svgEl("line", { x1: 0, x2: 0, y1: CH.top, y2: y(0),
    stroke: css("--muted"), "stroke-width": 1, visibility: "hidden" });
  svg.appendChild(crosshair);

  // 시리즈: 2px 라인 + 끝점 8px 마커(2px surface 링) + 직접 라벨
  state.configs.forEach((cfg, ci) => {
    const color = css(SERIES_VARS[ci]);
    const days = state.index[cfg.id].days;
    const dPath = days.map((d, i) => `${i ? "L" : "M"}${x(i)},${y(d.fail)}`).join("");
    svg.appendChild(svgEl("path", { d: dPath, fill: "none", stroke: color,
      "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    const li = days.length - 1;
    svg.appendChild(svgEl("circle", { cx: x(li), cy: y(days[li].fail), r: 4,
      fill: color, stroke: surface, "stroke-width": 2 }));
    const label = Object.assign(svgEl("text", { x: x(li) + 10, y: y(days[li].fail) + 4,
      "font-size": 12, fill: css("--ink-2") }), { textContent: `${cfg.id} ${days[li].fail}` });
    svg.appendChild(label);
  });

  // hover 레이어: 크로스헤어가 X를 찾고, 툴팁은 전 시리즈를 보여준다
  const overlay = svgEl("rect", { x: CH.left, y: CH.top,
    width: CH.w - CH.left - CH.right, height: CH.h - CH.top - CH.bottom,
    fill: "transparent", cursor: "pointer" });
  svg.appendChild(overlay);

  const tooltip = $("tooltip");
  const idxFromEvent = (ev) => {
    const rect = svg.getBoundingClientRect();
    const px = ((ev.clientX - rect.left) / rect.width) * CH.w;
    let best = 0, bestDist = Infinity;
    state.dates.forEach((_, i) => {
      const d = Math.abs(x(i) - px);
      if (d < bestDist) { bestDist = d; best = i; }
    });
    return best;
  };

  overlay.addEventListener("pointermove", (ev) => {
    const i = idxFromEvent(ev);
    crosshair.setAttribute("x1", x(i));
    crosshair.setAttribute("x2", x(i));
    crosshair.setAttribute("visibility", "visible");

    tooltip.replaceChildren(el("div", "tt-date", state.dates[i]));
    const rows = state.configs.map((cfg, ci) => ({ cfg, ci, row: dayRow(cfg.id, state.dates[i]) }))
      .sort((a, b) => b.row.fail - a.row.fail);
    for (const { cfg, ci, row } of rows) {
      const r = el("div", "tt-row");
      const key = el("span", "tt-key");
      key.style.borderTopColor = css(SERIES_VARS[ci]);
      r.appendChild(key);
      r.appendChild(el("span", "tt-val", String(row.fail)));
      r.appendChild(el("span", "tt-name", cfg.id));
      if (row.new_fail > 0) r.appendChild(el("span", "tt-new", `신규 ${row.new_fail}`));
      tooltip.appendChild(r);
    }
    const wrapRect = $("chart-wrap").getBoundingClientRect();
    const rect = svg.getBoundingClientRect();
    const pxOnScreen = (x(i) / CH.w) * rect.width;
    tooltip.style.display = "block";
    const flip = pxOnScreen > wrapRect.width * 0.72;
    tooltip.style.left = flip ? `${pxOnScreen - tooltip.offsetWidth - 14}px` : `${pxOnScreen + 14}px`;
    tooltip.style.top = "24px";
  });
  overlay.addEventListener("pointerleave", () => {
    crosshair.setAttribute("visibility", "hidden");
    tooltip.style.display = "none";
  });
  overlay.addEventListener("click", (ev) => {
    selectDate(state.dates[idxFromEvent(ev)]);
  });
}

function renderLegend() {
  const legend = $("legend");
  legend.replaceChildren();
  state.configs.forEach((cfg, ci) => {
    const item = el("span", "item");
    const key = el("span", "key");
    key.style.borderTopColor = css(SERIES_VARS[ci]);
    item.appendChild(key);
    item.appendChild(el("span", null, `${cfg.id} · ${cfg.label} (TC ${cfg.total})`));
    legend.appendChild(item);
  });
}

// 추이 데이터 표 (차트의 테이블 뷰 — 접근성/relief 채널)
function renderTrendTable() {
  const wrap = $("trend-table");
  wrap.replaceChildren();
  const table = el("table");
  const thead = el("thead");
  const hr = el("tr");
  hr.appendChild(el("th", null, "날짜"));
  state.configs.forEach((cfg) => {
    hr.appendChild(el("th", "num", `${cfg.id} fail`));
    hr.appendChild(el("th", "num", "신규"));
  });
  thead.appendChild(hr);
  table.appendChild(thead);
  const tbody = el("tbody");
  state.dates.forEach((date) => {
    const tr = el("tr");
    tr.appendChild(el("td", null, date));
    state.configs.forEach((cfg) => {
      const row = dayRow(cfg.id, date);
      tr.appendChild(el("td", "num", String(row.fail)));
      tr.appendChild(el("td", "num", row.new_fail ? String(row.new_fail) : "·"));
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
}

// ---------------------------------------------------------------- 날짜별 상세
async function renderDetail() {
  const detail = $("detail");
  detail.replaceChildren();

  for (const [ci, cfg] of state.configs.entries()) {
    const day = await dailyOf(cfg.id, state.selected);
    const block = el("div", "cfg-block");
    const h = el("h3");
    const key = el("span", "key");
    key.style.borderTopColor = css(SERIES_VARS[ci]);
    h.appendChild(key);
    h.appendChild(el("span", null, `${cfg.id} · ${cfg.label}`));
    const s = day.summary;
    h.appendChild(el("span", "sum",
      `total ${s.total} · pass ${s.pass} · fail ${s.fail} · 신규 ${s.new_fail}`));
    block.appendChild(h);

    const tcs = Object.keys(day.failures).sort();
    if (tcs.length === 0) {
      block.appendChild(el("div", "all-green", "✓ 전 TC pass"));
      detail.appendChild(block);
      continue;
    }

    const table = el("table");
    const thead = el("thead");
    const hr = el("tr");
    for (const t of ["TC", "상태", "로그 발췌", "추정 원인 (agent)", "로그"]) {
      hr.appendChild(el("th", null, t));
    }
    thead.appendChild(hr);
    table.appendChild(thead);
    const tbody = el("tbody");

    // 신규 fail을 위로
    tcs.sort((a, b) => {
      const sa = day.failures[a].status === "new" ? 0 : 1;
      const sb = day.failures[b].status === "new" ? 0 : 1;
      return sa - sb || a.localeCompare(b);
    });
    for (const tc of tcs) {
      const f = day.failures[tc];
      const tr = el("tr");
      tr.appendChild(el("td", "mono", tc));

      const tdSt = el("td");
      if (f.status === "new") {
        tdSt.appendChild(el("span", "badge-new", "신규"));
      } else {
        tdSt.appendChild(el("span", "st-ongoing", "지속"));
        tdSt.appendChild(document.createElement("br"));
        tdSt.appendChild(el("span", "since", `since ${f.since}`));
      }
      tr.appendChild(tdSt);

      tr.appendChild(el("td", "excerpt mono", f.log_excerpt));

      const tdSus = el("td");
      if (f.suspect_sha) {
        tdSus.appendChild(el("span", "mono", `${f.author} @ ${f.suspect_sha}`));
        tdSus.appendChild(document.createElement("br"));
        tdSus.appendChild(el("span", "conf", `확신도: ${CONF_LABEL[f.confidence] ?? f.confidence}`));
      } else {
        tdSus.appendChild(el("span", "conf", "—"));
      }
      tr.appendChild(tdSus);

      const tdLink = el("td");
      const a = el("a", null, "열기");
      a.href = f.log_url;
      a.target = "_blank";
      a.rel = "noopener";
      tdLink.appendChild(a);
      tr.appendChild(tdLink);

      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    block.appendChild(table);
    detail.appendChild(block);
  }
}

function renderDateSelect() {
  const sel = $("date-select");
  sel.replaceChildren();
  for (const date of [...state.dates].reverse()) {
    const o = el("option", null, date);
    o.value = date;
    sel.appendChild(o);
  }
  sel.value = state.selected;
  sel.onchange = () => selectDate(sel.value);
}

function selectDate(date) {
  state.selected = date;
  $("date-select").value = date;
  renderChart();  // 선택 표시선 갱신
  renderDetail();
}

function render() {
  renderStats();
  renderLegend();
  renderChart();
  renderTrendTable();
  renderDateSelect();
  renderDetail();
}

load().then(render).catch((err) => {
  const box = $("error-box");
  box.style.display = "block";
  box.replaceChildren(
    el("div", null, `데이터 로드 실패: ${err.message}`),
    el("div", null, "repo 루트에서 정적 서버로 서빙해야 합니다 — 예: python3 -m http.server 후 /docs/ 접속"),
  );
});

$("range-label").textContent = "results/*/index.json 기반";
</script>
</body>
</html>
